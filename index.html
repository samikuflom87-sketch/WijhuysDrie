<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#B8492F" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#6B2F19" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Habesha Steps" />
    <meta name="description" content="Learn Tigrinya the fun way — gamified lessons, exercises, and streaks." />
    <title>Habesha Steps</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: linear-gradient(160deg, #8a371f, #b8492f);
        transition: opacity 0.4s ease;
      }
      @media (prefers-color-scheme: dark) {
        #splash {
          background: linear-gradient(160deg, #48200f, #6b2f19);
        }
      }
      #splash img {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        animation: splash-pulse 1.1s ease-in-out infinite;
      }
      #splash span {
        font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
        font-weight: 700;
        font-size: 20px;
        color: #fffcf7;
        letter-spacing: 0.01em;
      }
      #splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/favicon.svg" alt="" />
      <span>Habesha Steps</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
